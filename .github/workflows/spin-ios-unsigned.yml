name: Spin iOS Unsigned Archive
run-name: spin-ios-unsigned-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current rune-spin main SHA verified by Jenkins
        required: true
        type: string
      build_number:
        description: Jenkins build number
        required: true
        type: string
      request_id:
        description: Unpredictable Jenkins request identity
        required: true
        type: string
      source_plain_sha256:
        description: SHA-256 of the decrypted source archive
        required: true
        type: string
      output_public_key:
        description: Base64-encoded one-time Jenkins RSA public key for the unsigned archive
        required: true
        type: string

permissions:
  contents: read

jobs:
  unsigned-archive:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      TRUSTED_GITHUB_MERGER: KorStrix
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TEAM_ID: V2GZJ6C3RZ
      BUNDLE_ID: com.yjsgames.spin
      BUILD_COMMIT: ${{ inputs.commit_sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      REQUEST_ID: ${{ inputs.request_id }}
      SOURCE_PLAIN_SHA256: ${{ inputs.source_plain_sha256 }}
      OUTPUT_PUBLIC_KEY: ${{ inputs.output_public_key }}
      VITE_FIREBASE_ANALYTICS_ENABLED: "false"
      VITE_FIREBASE_API_KEY: AIzaSyBgeZX8b_1dPgejRWQBOYV7BWPq9ZsdCIo
      VITE_FIREBASE_AUTH_DOMAIN: spin-game-services-221126.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: spin-game-services-221126
      VITE_FIREBASE_APP_ID: 1:289090959480:web:fd37d951d9a0e59946d58d
      VITE_FIREBASE_MESSAGING_SENDER_ID: "289090959480"
    steps:
      - name: Validate request identity
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = YJS-Games/rune-spin-macos-runner
          test "$GITHUB_REF" = refs/tags/spin-ios-unsigned-v10
          test "$GITHUB_ACTOR" = "$TRUSTED_GITHUB_MERGER"
          case "$BUILD_COMMIT" in ''|*[!0-9a-f]*) exit 64 ;; esac
          test "${#BUILD_COMMIT}" = 40
          case "$BUILD_NUMBER" in ''|*[!0-9]*) exit 64 ;; esac
          case "$REQUEST_ID" in ''|*[!A-Za-z0-9._-]*) exit 64 ;; esac
          case "$SOURCE_PLAIN_SHA256" in ''|*[!0-9a-f]*) exit 64 ;; esac
          test "${#SOURCE_PLAIN_SHA256}" = 64
          test -n "$OUTPUT_PUBLIC_KEY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Generate one-time encryption keypair
        run: |
          set -euo pipefail
          node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const pair = crypto.generateKeyPairSync("rsa", {
              modulusLength: 3072,
              publicKeyEncoding: { type: "spki", format: "pem" },
              privateKeyEncoding: { type: "pkcs8", format: "pem" },
            });
            fs.writeFileSync("source-private.pem", pair.privateKey, { mode: 0o400 });
            fs.writeFileSync("source-public.pem", pair.publicKey, { mode: 0o400 });
          '
      - name: Publish run-scoped encryption public key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spin-ios-source-key-${{ inputs.request_id }}
          path: source-public.pem
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Wait for, verify and decrypt exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="spin-ios-source-$REQUEST_ID"
          handoff_asset_name="$release_tag.handoff.zip"
          handoff_asset_url=''
          # Handoff contract: Jenkins key wait 20m + encryption 10m + release/upload/reconcile 17m < worker wait 90m.
          for attempt in $(seq 1 1080); do
            gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" > source-release.json 2>/dev/null || true
            HANDOFF_ASSET_NAME="$handoff_asset_name" node -e '
              const fs=require("fs");
              const value=JSON.parse(fs.readFileSync("source-release.json","utf8")||"{}");
              const matches=(value.assets||[]).filter((v)=>v.name===process.env.HANDOFF_ASSET_NAME&&v.state==="uploaded");
              if(matches.length>1) throw new Error("duplicate encrypted handoff assets");
              fs.writeFileSync("source-asset-url.txt",matches.length===1?matches[0].browser_download_url:"");
            '
            handoff_asset_url="$(cat source-asset-url.txt)"
            [ -n "$handoff_asset_url" ] && break
            sleep 5
          done
          case "$handoff_asset_url" in https://github.com/YJS-Games/rune-spin-macos-runner/releases/download/*) ;; *) echo 'ERROR: exact encrypted handoff asset was not published in time'; exit 1 ;; esac
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 300 "$handoff_asset_url" -o source-handoff.zip
          expected_entries="$(printf '%s\n' "$release_tag.key.enc" "$release_tag.tar.gz.enc" | LC_ALL=C sort)"
          test "$(unzip -Z1 source-handoff.zip | LC_ALL=C sort)" = "$expected_entries"
          unzip -p source-handoff.zip "$release_tag.tar.gz.enc" > source.tar.gz.enc
          unzip -p source-handoff.zip "$release_tag.key.enc" > source-key.enc
          rm -f source-handoff.zip
          node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const payload = fs.readFileSync("source.tar.gz.enc");
            if (payload.subarray(0, 8).toString("ascii") !== "SPINENC1" || payload.length < 36) throw new Error("invalid encrypted source envelope");
            const key = crypto.privateDecrypt({key:fs.readFileSync("source-private.pem"),padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:"sha256"},fs.readFileSync("source-key.enc"));
            if(key.length !== 32) throw new Error("invalid unwrapped source key");
            const iv = payload.subarray(8, 20);
            const tag = payload.subarray(20, 36);
            const decipher = crypto.createDecipheriv("aes-256-gcm", key, iv);
            decipher.setAuthTag(tag);
            fs.writeFileSync("source.tar.gz", Buffer.concat([decipher.update(payload.subarray(36)), decipher.final()]), { mode: 0o400 });
          '
          rm -f source.tar.gz.enc source-key.enc source-private.pem source-public.pem
          test "$(shasum -a 256 source.tar.gz | awk '{print $1}')" = "$SOURCE_PLAIN_SHA256"
          mkdir source
          tar -tzf source.tar.gz > source-entries.txt
          node -e '
            const fs = require("fs");
            const entries = fs.readFileSync("source-entries.txt", "utf8").split(/\r?\n/).filter(Boolean);
            if (!entries.length || !entries.includes("./.ci-source-manifest.json")) throw new Error("missing source manifest");
            if (new Set(entries).size !== entries.length) throw new Error("duplicate source entries");
            for (const entry of entries) {
              if (entry.startsWith("/") || entry.split("/").includes("..")) throw new Error(`unsafe source entry: ${entry}`);
            }
          '
          tar -xzf source.tar.gz --no-same-owner -C source
          rm -f source.tar.gz source-entries.txt source-release.json source-asset-url.txt
      - name: Build credential-free unsigned archive
        working-directory: source
        run: ./tools/build-ios-unsigned.sh
      - name: Encrypt unsigned archive for Jenkins
        run: |
          set -euo pipefail
          printf '%s' "$OUTPUT_PUBLIC_KEY" | base64 --decode > output-public.pem
          node -e '
            const crypto = require("crypto");
            const fs = require("fs");
            const publicKey = crypto.createPublicKey(fs.readFileSync("output-public.pem"));
            if (publicKey.asymmetricKeyType !== "rsa" || publicKey.asymmetricKeyDetails?.modulusLength !== 3072) throw new Error("unexpected Jenkins output public key");
            const plain = fs.readFileSync("source/dist-unsigned-ios/App.xcarchive.zip");
            const key = crypto.randomBytes(32);
            const iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv("aes-256-gcm", key, iv);
            const encrypted = Buffer.concat([cipher.update(plain), cipher.final()]);
            const envelope = Buffer.concat([Buffer.from("SPINENC1", "ascii"), iv, cipher.getAuthTag(), encrypted]);
            const wrapped = crypto.publicEncrypt({key:publicKey,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:"sha256"}, key);
            fs.writeFileSync("source/dist-unsigned-ios/App.xcarchive.zip.enc", envelope, { mode: 0o400 });
            fs.writeFileSync("source/dist-unsigned-ios/App.xcarchive.key.enc", wrapped, { mode: 0o400 });
          '
          rm -f output-public.pem source/dist-unsigned-ios/App.xcarchive.zip
          test "$(find source/dist-unsigned-ios -type f | wc -l | tr -d ' ')" = 3
      - name: Upload credential-free handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spin-unsigned-ios-${{ inputs.request_id }}
          path: source/dist-unsigned-ios
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
