name: Spin iOS Source Release Janitor

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  remove-stale-source-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete inactive stale draft releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = YJS-Games/rune-spin-macos-runner
          cutoff="$(date -u -d '2 hours ago' +%s)"
          gh api --paginate --slurp "/repos/$REPOSITORY/releases?per_page=100" > release-pages.json
          gh api --paginate --slurp "/repos/$REPOSITORY/git/matching-refs/tags/spin-ios-source-jenkins-?per_page=100" > tag-pages.json
          gh api --paginate --slurp "/repos/$REPOSITORY/actions/workflows/spin-ios-unsigned.yml/runs?per_page=100" > run-pages.json
          CUTOFF="$cutoff" node <<'NODE' > stale-handoffs.txt
          const fs = require("fs");
          const releases = JSON.parse(fs.readFileSync("release-pages.json", "utf8")).flat();
          const refs = JSON.parse(fs.readFileSync("tag-pages.json", "utf8")).flat();
          const runs = JSON.parse(fs.readFileSync("run-pages.json", "utf8")).flatMap((page) => page.workflow_runs || []);
          const cutoff = Number(process.env.CUTOFF);
          const releaseTags = new Set(releases.map((release) => release.tag_name));
          const isActive = (requestId) => runs.some((run) =>
            run.display_title === `spin-ios-unsigned-${requestId}` &&
            run.event === "workflow_dispatch" &&
            run.path === ".github/workflows/spin-ios-unsigned.yml" &&
            run.head_repository?.full_name === process.env.REPOSITORY &&
            run.status !== "completed"
          );
          for (const release of releases) {
            if (release.draft || !release.prerelease || !/^spin-ios-source-jenkins-[0-9]+-[0-9a-f-]{36}$/.test(release.tag_name || "")) continue;
            if (release.name !== release.tag_name || Date.parse(release.created_at) / 1000 >= cutoff) continue;
            const requestId = release.tag_name.slice("spin-ios-source-".length);
            if (!isActive(requestId)) process.stdout.write(`${release.id}\t${release.tag_name}\n`);
          }
          for (const ref of refs) {
            const releaseTag = String(ref.ref || "").replace(/^refs\/tags\//, "");
            if (!/^spin-ios-source-jenkins-[0-9]+-[0-9a-f-]{36}$/.test(releaseTag) || releaseTags.has(releaseTag)) continue;
            const requestId = releaseTag.slice("spin-ios-source-".length);
            if (!isActive(requestId)) process.stdout.write(`-\t${releaseTag}\n`);
          }
          NODE
          cleanup_status=0
          while IFS=$'\t' read -r release_id release_tag; do
            case "$release_id" in -) ;; ''|*[!0-9]*) cleanup_status=1; continue ;; *) ;; esac
            case "$release_tag" in spin-ios-source-jenkins-*) ;; *) exit 64 ;; esac
            tag_status="$(curl -sS -o tag-delete-response.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/git/refs/tags/$release_tag")"
            case "$tag_status" in 204|404) ;; *) echo "tag cleanup failed for $release_tag: HTTP $tag_status"; cleanup_status=1 ;; esac
            if [ "$release_id" != - ]; then
              release_status="$(curl -sS -o release-delete-response.json -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$REPOSITORY/releases/$release_id")"
              case "$release_status" in 204|404) ;; *) echo "release cleanup failed for $release_tag: HTTP $release_status"; cleanup_status=1 ;; esac
            fi
          done < stale-handoffs.txt
          exit "$cleanup_status"
