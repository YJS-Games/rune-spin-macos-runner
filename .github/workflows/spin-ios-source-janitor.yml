name: Spin iOS Source Release Janitor

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  remove-stale-source-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete inactive stale draft releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$REPOSITORY" = YJS-Games/rune-spin-macos-runner
          cutoff="$(date -u -d '2 hours ago' +%s)"
          gh api --paginate --slurp "/repos/$REPOSITORY/releases?per_page=100" > release-pages.json
          gh api --paginate --slurp "/repos/$REPOSITORY/git/matching-refs/tags/spin-ios-source-jenkins-?per_page=100" > ios-tag-pages.json
          gh api --paginate --slurp "/repos/$REPOSITORY/git/matching-refs/tags/spin-android-source-jenkins-?per_page=100" > android-tag-pages.json
          gh api --paginate --slurp "/repos/$REPOSITORY/actions/workflows/spin-ios-unsigned.yml/runs?per_page=100" > ios-run-pages.json
          gh api --paginate --slurp "/repos/$REPOSITORY/actions/workflows/spin-android-unsigned.yml/runs?per_page=100" > android-run-pages.json
          CUTOFF="$cutoff" node <<'NODE' > stale-handoffs.txt
          const fs = require("fs");
          const releases = JSON.parse(fs.readFileSync("release-pages.json", "utf8")).flat();
          const refs = ["ios-tag-pages.json", "android-tag-pages.json"].flatMap((path) => JSON.parse(fs.readFileSync(path, "utf8")).flat());
          const runs = ["ios-run-pages.json", "android-run-pages.json"].flatMap((path) => JSON.parse(fs.readFileSync(path, "utf8")).flatMap((page) => page.workflow_runs || []));
          const cutoff = Number(process.env.CUTOFF);
          const releaseTags = new Set(releases.map((release) => release.tag_name));
          const isActive = (platform, requestId) => runs.some((run) =>
            run.display_title === `spin-${platform}-unsigned-${requestId}` &&
            run.event === "workflow_dispatch" &&
            run.path === `.github/workflows/spin-${platform}-unsigned.yml` &&
            run.head_repository?.full_name === process.env.REPOSITORY &&
            run.status !== "completed"
          );
          for (const release of releases) {
            const match = /^spin-(ios|android)-source-(jenkins-[0-9]+-[0-9a-f-]{36})$/.exec(release.tag_name || "");
            if (release.draft || !release.prerelease || !match) continue;
            if (release.name !== release.tag_name || Date.parse(release.created_at) / 1000 >= cutoff) continue;
            if (!isActive(match[1], match[2])) process.stdout.write(`${release.id}\t${release.tag_name}\n`);
          }
          for (const ref of refs) {
            const releaseTag = String(ref.ref || "").replace(/^refs\/tags\//, "");
            const match = /^spin-(ios|android)-source-(jenkins-[0-9]+-[0-9a-f-]{36})$/.exec(releaseTag);
            if (!match || releaseTags.has(releaseTag)) continue;
            if (!isActive(match[1], match[2])) process.stdout.write(`-\t${releaseTag}\n`);
          }
          NODE
          cleanup_status=0
          while IFS=$'\t' read -r release_id release_tag; do
            case "$release_id" in -) ;; ''|*[!0-9]*) cleanup_status=1; continue ;; *) ;; esac
            case "$release_tag" in spin-ios-source-jenkins-*|spin-android-source-jenkins-*) ;; *) exit 64 ;; esac
            set +e
            tag_status="$(curl -sS -o tag-delete-response.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$REPOSITORY/git/refs/tags/$release_tag")"
            tag_curl_status=$?
            set -e
            case "$tag_curl_status:$tag_status" in 0:204|0:404) ;; *) echo "tag cleanup failed for $release_tag: curl=$tag_curl_status HTTP=$tag_status"; cleanup_status=1 ;; esac
            if [ "$release_id" != - ]; then
              set +e
              release_status="$(curl -sS -o release-delete-response.json -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$REPOSITORY/releases/$release_id")"
              release_curl_status=$?
              set -e
              case "$release_curl_status:$release_status" in 0:204|0:404) ;; *) echo "release cleanup failed for $release_tag: curl=$release_curl_status HTTP=$release_status"; cleanup_status=1 ;; esac
            fi
          done < stale-handoffs.txt
          exit "$cleanup_status"
