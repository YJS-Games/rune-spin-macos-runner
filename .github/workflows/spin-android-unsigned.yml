name: Spin Android Unsigned Artifacts
run-name: spin-android-unsigned-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current rune-spin main SHA verified by Jenkins
        required: true
        type: string
      build_number:
        description: Jenkins build number and Android versionCode
        required: true
        type: string
      version_name:
        description: Android versionName from the approved source
        required: true
        type: string
      request_id:
        description: Unpredictable Jenkins request identity
        required: true
        type: string
      source_release_tag:
        description: Exact private runner release containing the source archive
        required: true
        type: string
      source_archive_sha256:
        description: SHA-256 of the private source archive
        required: true
        type: string

permissions:
  contents: read

jobs:
  unsigned-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TRUSTED_GITHUB_MERGER: KorStrix
      BUILD_COMMIT: ${{ inputs.commit_sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      SPIN_VERSION_NAME: ${{ inputs.version_name }}
      REQUEST_ID: ${{ inputs.request_id }}
      SOURCE_RELEASE_TAG: ${{ inputs.source_release_tag }}
      SOURCE_ARCHIVE_SHA256: ${{ inputs.source_archive_sha256 }}
      VITE_FIREBASE_ANALYTICS_ENABLED: "false"
      VITE_FIREBASE_API_KEY: AIzaSyBgeZX8b_1dPgejRWQBOYV7BWPq9ZsdCIo
      VITE_FIREBASE_AUTH_DOMAIN: spin-game-services-221126.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: spin-game-services-221126
      VITE_FIREBASE_APP_ID: 1:289090959480:web:fd37d951d9a0e59946d58d
      VITE_FIREBASE_MESSAGING_SENDER_ID: "289090959480"
    steps:
      - name: Validate exact private handoff request
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = YJS-Games/rune-spin-macos-runner
          test "$GITHUB_REF" = refs/tags/spin-ios-unsigned-v7
          test "$GITHUB_ACTOR" = "$TRUSTED_GITHUB_MERGER"
          case "$BUILD_COMMIT" in ''|*[!0-9a-f]*) exit 64 ;; esac
          test "${#BUILD_COMMIT}" = 40
          case "$BUILD_NUMBER" in ''|*[!0-9]*) exit 64 ;; esac
          case "$REQUEST_ID" in ''|*[!A-Za-z0-9._-]*) exit 64 ;; esac
          case "$SOURCE_RELEASE_TAG" in spin-android-source-jenkins-*) ;; *) exit 64 ;; esac
          case "$SOURCE_ARCHIVE_SHA256" in ''|*[!0-9a-f]*) exit 64 ;; esac
          test "${#SOURCE_ARCHIVE_SHA256}" = 64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Download and verify exact private source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_RELEASE_TAG" > source-release.json
          SOURCE_RELEASE_TAG="$SOURCE_RELEASE_TAG" node -e 'const fs=require("fs"); const value=JSON.parse(fs.readFileSync("source-release.json","utf8")); const name=process.env.SOURCE_RELEASE_TAG+".tar.gz"; if(value.draft||!value.prerelease||value.tag_name!==process.env.SOURCE_RELEASE_TAG||value.name!==process.env.SOURCE_RELEASE_TAG||value.author?.login!==process.env.TRUSTED_GITHUB_MERGER) throw new Error("unexpected private source release"); const matches=(value.assets||[]).filter((asset)=>asset.name===name&&asset.state==="uploaded"); if(matches.length!==1) throw new Error("unexpected private source asset set"); process.stdout.write(matches[0].browser_download_url);' > source-url.txt
          source_url="$(cat source-url.txt)"
          case "$source_url" in https://github.com/YJS-Games/rune-spin-macos-runner/releases/download/*) ;; *) exit 1 ;; esac
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 900 -H "Authorization: Bearer $GH_TOKEN" "$source_url" -o source.tar.gz
          test "$(shasum -a 256 source.tar.gz | awk '{print $1}')" = "$SOURCE_ARCHIVE_SHA256"
          tar -tzf source.tar.gz > source-entries.txt
          node -e 'const fs=require("fs"); const entries=fs.readFileSync("source-entries.txt","utf8").split(/\r?\n/).filter(Boolean); if(!entries.length||new Set(entries).size!==entries.length) throw new Error("invalid source archive entries"); for(const entry of entries){if(entry.startsWith("/")||entry.split("/").includes("..")) throw new Error(`unsafe source entry: ${entry}`);}'
          mkdir source
          tar -xzf source.tar.gz --no-same-owner -C source
          rm -f source.tar.gz source-entries.txt source-release.json source-url.txt
      - name: Build credential-free unsigned Android artifacts
        working-directory: source
        run: ./tools/build-android-unsigned.sh
      - name: Upload private unsigned handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spin-unsigned-android-${{ inputs.request_id }}
          path: source/dist-unsigned-android
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
